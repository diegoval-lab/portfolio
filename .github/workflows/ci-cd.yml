name: CI - Build and Security

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t mi-app-node:${{ github.sha }} ./app

      - name: Ejecutar escaneo de vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-node:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Guardamos el hash del commit en un archivo temporal por si el CD lo necesita
      - name: Guardar tag de imagen como artefacto
        run: echo "${{ github.sha }}" > image_tag.txt

      - name: Subir artefacto del tag
        uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image_tag.txt